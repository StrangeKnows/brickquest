<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Brick Quest — Player</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rumble.css">
<link rel="stylesheet" href="boardFx.css">
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cls-color:#888;--cls-bg:#111;--cls-border:#333;
  --surface:#0f0f0f;--surface2:#1a1a1a;--surface3:#242424;
  --text:#e8e8e8;--text-dim:#888;--text-faint:#444;
  --green:#1D9E75;--red:#E24B4A;--yellow:#F5D000;--orange:#F57C00;
}
html{height:100%;overflow:hidden;}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--surface);color:var(--text);font-size:16px;font-weight:600;overflow:hidden;height:100%;margin:0;padding:0;}

/* ── CLASS SELECTOR ── */
#class-select-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;height:100dvh;padding:20px;
  background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0a 100%);
}
#class-select-screen h1{
  font-family:'Cinzel',serif;font-size:28px;color:#F5D000;
  letter-spacing:.1em;margin-bottom:6px;text-align:center;
}
#class-select-screen p{font-size:14px;color:#666;margin-bottom:24px;text-align:center;}
.cls-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:400px;}
.cls-btn{
  padding:16px 8px;border-radius:12px;border:1px solid #333;
  background:#1a1a1a;cursor:pointer;text-align:center;
  transition:all .2s;
}
.cls-btn:active{transform:scale(.95);}
.cls-btn .icon{font-size:28px;display:block;margin-bottom:4px;}
.cls-btn .cname{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;color:#aaa;}
.cls-btn:hover{border-color:#666;}

/* ── MAIN LAYOUT ── */
#game-screen{
  display:none;
  height:100vh;
  height:100dvh;
  flex-direction:column;
  width:100%;
  max-width:100%;
  overflow:hidden;
  box-sizing:border-box;
  position:relative;
}
#game-screen.visible{display:flex;}

/* ── RUMBLE (real-time combat runtime) ── */
/* rumble-root fills the viewport when a battle is active. Hidden by default;
   becomes visible when server state reports an active rumbleBattle. Takes
   visual precedence over game-screen (z-index stacks above). */
#rumble-root{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#0a0a0a;
  z-index:100;
  overflow:hidden;
}
#rumble-root.visible{display:block;}
#rumble-root #rumble-canvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  touch-action:none;
  z-index:1;  /* override rumble.css's z-index:50 — bricks must layer above */
}
#rumble-root #rumble-hud{
  position:absolute;top:8px;right:10px;
  color:#e8e8e8;font-family:'Cinzel',serif;
  font-size:14px;letter-spacing:.08em;
  pointer-events:none;z-index:10;
}
#rumble-root #rumble-timer-display{font-size:22px;font-weight:700;}
#rumble-root #rumble-timer-label{font-size:9px;color:#888;letter-spacing:.12em;}
#rumble-root .rumble-brick-bar{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:6px;
  max-height:95vh;
  overflow-y:auto;
  z-index:60;  /* must beat canvas z-index */
}
#rumble-root #rumble-brick-bar-left{left:0;}
#rumble-root #rumble-brick-bar-right{right:0;}
/* Rumble exit overlay — shown briefly on battleEnd before handing back to board */
#rumble-exit-overlay{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);padding:24px 36px;
  border:2px solid var(--yellow);border-radius:8px;
  font-family:'Cinzel',serif;font-size:20px;letter-spacing:.08em;
  text-align:center;color:#fff;z-index:20;display:none;
}
#rumble-exit-overlay.visible{display:block;}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:4px 12px;
  background:linear-gradient(90deg,var(--cls-bg),#0a0a0a);
  border-bottom:1px solid var(--cls-border);
  flex-shrink:0;
  transition:max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease, border-bottom-width 0.2s ease;
  max-height:36px;
  overflow:hidden;
}
.topbar.hidden-on-scroll{
  max-height:0;
  padding-top:0;
  padding-bottom:0;
  opacity:0;
  border-bottom-width:0;
}
.topbar-icon{font-size:18px;}
.topbar-name{font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:var(--cls-color);}
/* v0.16.8: connect indicator is a small dot next to topbar-name, replacing
   the standalone conn-pill. 8px circle, color-coded for connection state. */
.conn-dot{
  width:8px;height:8px;border-radius:50%;
  margin-left:6px;
  display:inline-block;vertical-align:middle;
  transition:background .2s, box-shadow .2s;
}
.conn-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
.conn-dot.off{background:#444;box-shadow:none;}

/* PHASE BANNER */
.phase-banner{
  padding:4px 14px;text-align:center;font-size:11px;font-weight:600;
  font-family:'Cinzel',serif;letter-spacing:.05em;flex-shrink:0;
  transition:max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease, border-bottom-width 0.2s ease;
  max-height:32px;
  overflow:hidden;
}
.phase-banner.hidden-on-scroll{
  max-height:0;
  padding-top:0;
  padding-bottom:0;
  opacity:0;
  border-bottom-width:0;
}
.phase-banner.mine{background:var(--cls-bg);border-bottom:1px solid var(--cls-color);color:var(--cls-color);}
.phase-banner.waiting{background:#0a0a0a;border-bottom:1px solid #222;color:#444;}
.phase-banner.battle-mine{background:#1a0505;border-bottom:2px solid var(--red);color:var(--red);}
.phase-banner.battle-wait{background:#0f0505;border-bottom:1px solid #333;color:#555;}

/* DASHBOARD HOST (v0.16.8 — replaces tabs system entirely)
   Single full-height surface that scrolls. The dashboard surface contains:
     1. Compact header (avatar+name+zone+conn-dot, HP, shield)
     2. Dynamic zone (flavor text now; events, market, cheese options,
        party, fusion in v0.16.9+)
     3. Interaction row (brick chips + coin chip + cheese chip + avatar)
   Tabs/panes (party, fusion) are gone. Hold-gestures on chips will surface
   their respective views in the dynamic zone (v0.16.9). */
.dashboard-host{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px;
  padding-bottom:max(12px, env(safe-area-inset-bottom, 12px));
  background:var(--surface);
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.dash-surface{display:none;min-height:100%;padding-bottom:calc(160px + env(safe-area-inset-bottom, 0px));}
.dash-surface.active{display:block;}

/* DYNAMIC ZONE (v0.16.8 — single multi-state slot between header and bricks)
   States: idle (flavor text) / event (landing card) / market / cheese / party
   / fusion. Foundation patch (v0.16.8) renders idle and event only — other
   states light up in v0.16.9 when hold-gestures wire in. */
.dynamic-zone{
  position:relative;
  margin-bottom:10px;
  min-height:48px;
  transition:min-height .25s ease;
}
.dynamic-zone:empty{display:none;}

/* INTERACTION ROW (v0.16.8 — bottom row, bricks + coin + cheese + avatar)
   Each chip is a hold-target. Coin/cheese/avatar holds invoke their dynamic
   zone surface (v0.16.9). Brick chips retain existing hold-tier behavior;
   future fusion-drag gesture lands in v0.16.10. */
.interaction-row{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;
  padding:8px;
  background:var(--surface2);border:1px solid #2a2a2a;border-radius:10px;
  margin-bottom:10px;
}
.interaction-row .brick-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;}
.interaction-row .resource-chips{display:flex;gap:6px;align-items:stretch;}

/* RESOURCE CHIP (gold + cheese in interaction row; avatar tile too) */
.res-chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:44px;padding:6px 10px;
  background:var(--surface3);border-radius:8px;border:1px solid transparent;
  cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:border-color .15s, background .15s, transform .1s;
  touch-action:none;
}
.res-chip:active{transform:scale(.95);}
.res-chip-glyph{font-size:18px;line-height:1;}
.res-chip-num{font-family:'Cinzel',serif;font-size:14px;font-weight:700;margin-top:2px;}
.res-chip[data-res="gold"] .res-chip-num{color:#F5D000;}
.res-chip[data-res="cheese"] .res-chip-num{color:#FFD96A;}
.res-chip[data-res="avatar"]{padding:6px 8px;}
.res-chip[data-res="avatar"] .res-chip-glyph{font-size:24px;}

/* CARDS */
.card{
  background:var(--surface2);border:1px solid #2a2a2a;
  border-radius:10px;padding:12px;margin-bottom:10px;
}
.card-title{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;
  color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;
}

/* HP BAR */
.hp-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.hp-big{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--cls-color);}
.hp-max{font-size:14px;color:var(--text-dim);}
.hpbar-outer{height:10px;border-radius:5px;background:#222;overflow:hidden;margin-bottom:8px;}
.hpbar-inner{height:100%;border-radius:5px;transition:width .4s,background .4s;}

/* STATS ROW */
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:stretch;}
.stat-chip{
  background:var(--surface3);border-radius:8px;padding:7px 12px;
  text-align:center;flex:1;min-width:55px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.stat-num{font-family:'Cinzel',serif;font-size:18px;font-weight:700;}
.stat-lbl{font-size:10px;color:var(--text-dim);margin-top:1px;}

/* BRICKS */
.bricks-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.brick-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px 4px 6px;border-radius:20px;
  font-size:12px;font-weight:600;cursor:pointer;
  transition:opacity .15s;border:1px solid transparent;
}
.brick-tag:active{opacity:.6;}
.brick-tag.zero{opacity:.3;cursor:default;}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;margin-bottom:7px;
  border-radius:10px;border:1px solid #333;background:var(--surface3);
  color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;transition:all .15s;
  line-height:1.3;
}
.btn:active{opacity:.7;transform:scale(.98);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn.primary{background:var(--cls-bg);border-color:var(--cls-color);color:var(--cls-color);}
.btn.danger{background:#1a0505;border-color:var(--red);color:var(--red);}
.btn.success{background:#051a0f;border-color:var(--green);color:var(--green);}
.btn.warn{background:#1a1005;border-color:var(--orange);color:var(--orange);}
.btn-row{display:flex;gap:6px;margin-bottom:7px;}
.btn-row .btn{margin-bottom:0;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;display:inline-block;width:auto;}
.adj{
  padding:5px 12px;font-size:16px;border-radius:7px;
  border:1px solid #333;background:var(--surface3);
  cursor:pointer;color:var(--text);font-weight:700;
}
.adj:active{opacity:.6;}

/* ROLL DISPLAY */
.roll-display{
  background:var(--surface3);border-radius:12px;
  padding:16px;text-align:center;margin:8px 0;
}
.roll-num{font-family:'Cinzel',serif;font-size:52px;font-weight:700;color:var(--cls-color);}
.roll-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

/* Blue Brick Events — Category B */
@keyframes blue-pulse{0%,100%{box-shadow:0 0 8px 2px #006DB755;}50%{box-shadow:0 0 20px 8px #006DB7aa;}}
@keyframes symbol-flash{0%{opacity:0;transform:scale(.8);}20%{opacity:1;transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:scale(.9);}}
@keyframes footstep-fade{0%{opacity:1;}70%{opacity:.8;}100%{opacity:0;}}
.blue-arena{position:relative;width:100%;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;background:#020a14;border:2px solid #006DB7;}
.blue-symbol{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;font-family:Cinzel,serif;font-weight:700;cursor:pointer;transition:transform .08s,background .1s;}
.blue-symbol:active{transform:scale(.9)!important;}
  position:relative;width:100%;height:180px;
  background:#1a0505;border:2px solid var(--orange);border-radius:12px;
  overflow:hidden;touch-action:none;user-select:none;
}
.tap-target{
  position:absolute;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff6a00,#cc3300);
  box-shadow:0 0 16px 4px #ff6a0088;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;transition:transform .08s;
  transform:translate(-50%,-50%);
}
.tap-target:active{transform:translate(-50%,-50%) scale(.85);}
@keyframes target-pop{
  0%{transform:translate(-50%,-50%) scale(0);}
  60%{transform:translate(-50%,-50%) scale(1.2);}
  100%{transform:translate(-50%,-50%) scale(1);}
}
@keyframes hit-ring{
  0%{width:56px;height:56px;opacity:.8;}
  100%{width:120px;height:120px;opacity:0;}
}
.hit-ring{
  position:absolute;border-radius:50%;border:3px solid #ff6a00;
  pointer-events:none;transform:translate(-50%,-50%);
  animation:hit-ring .4s ease-out forwards;
}

/* TRADE */
.trade-row{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:8px;background:var(--surface3);border:1px solid #2a2a2a;
  margin-bottom:6px;
}

/* PARTY */
.party-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:8px;
  background:var(--surface3);margin-bottom:6px;
}
.party-icon{font-size:20px;}
.party-hp-bar{flex:1;height:6px;border-radius:3px;background:#222;overflow:hidden;}
.party-hp-fill{height:100%;border-radius:3px;transition:width .3s;}

/* SKILL ROWS */
.skill-card{
  padding:10px 12px;border-radius:10px;border:1px solid #2a2a2a;
  background:var(--surface3);margin-bottom:7px;
}
.skill-card.locked .skill-name,.skill-card.locked .skill-desc{filter:blur(4px);user-select:none;pointer-events:none;}
.skill-card.partial{border-color:var(--cls-color);border-style:dashed;}
.skill-card.owned{border-color:var(--cls-color);}
.skill-name{font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--cls-color);margin-bottom:3px;}
.skill-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:5px;}
.skill-use{font-size:11px;color:var(--green);margin-top:3px;}
.skill-prog{height:3px;border-radius:2px;background:#222;overflow:hidden;margin-bottom:5px;}
.skill-prog-fill{height:100%;border-radius:2px;}
.cost-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.cost-tag{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px 2px 5px;border-radius:10px;font-size:11px;font-weight:600;
}

/* TRADE CONSENT MODAL */
@keyframes trade-pulse {
  0%,100%{box-shadow:0 0 0 0 #F5D00055,0 0 30px 4px #F5D00022;}
  50%{box-shadow:0 0 0 8px #F5D00000,0 0 40px 8px #F5D00044;}
}
@keyframes brick-drop {
  0%{opacity:0;transform:translateY(-12px) scale(.8);}
  60%{transform:translateY(3px) scale(1.05);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

/* S013 §1.2 — empty pip pulse, 3 recency tiers */
@keyframes pip-pulse {
  0%,100% { opacity: 0.55; }
  50%     { opacity: 0.95; }
}
.pip-empty            { animation: pip-pulse 1.8s ease-in-out infinite; } /* default: aging (30s+) */
.pip-empty.pulse-fast { animation-duration: 0.6s; }                       /* <5s since use */
.pip-empty.pulse-med  { animation-duration: 1.0s; }                       /* 5-30s since use */
.pip-empty.pulse-slow { animation-duration: 1.8s; }                       /* 30s+ / default  */

.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:100;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.visible{display:flex;animation:none;}
.modal-box{
  background:#1a1500;border:2px solid var(--gold);
  border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center;
  animation:trade-pulse 1.5s ease-in-out infinite;
}
.modal-title{font-family:'Cinzel',serif;font-size:18px;color:var(--gold);margin-bottom:10px;letter-spacing:.04em;}
.modal-body{font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}

/* STATUS BADGES */
.status-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.status-badge{
  font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;
}
.status-badge.poisoned{background:#1a0a00;color:var(--orange);}
.status-badge.cursed{background:#1a0a1a;color:#7B2FBE;}
.status-badge.confused{background:#1a1500;color:var(--yellow);}
.status-badge.down{background:#1a0505;color:var(--red);}

/* DIVIDER */
.dv{border:none;border-top:1px solid #222;margin:10px 0;}

/* NOTIFICATION TOAST */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;
  background:#1a1a1a;border:1px solid #444;color:var(--text);
  z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
</style>
</head>
<body>

<!-- Font-control pill (zoom slider). MUST live OUTSIDE #zoom-root —
     the wrapper has transform-origin set, which creates a new
     containing block and breaks position:fixed for descendants.
     fc-pill needs to stay viewport-anchored regardless of zoom. -->
<style>
#fc-pill{position:fixed;bottom:14px;right:14px;z-index:9999;display:flex;align-items:center;background:transparent;border:none;border-radius:22px;height:44px;padding:0 6px;overflow:hidden;width:44px;transition:width 0.3s ease,background 0.3s,border 0.25s;}
#fc-pill.open{width:200px;background:rgba(0,0,0,0.72);border:1.5px solid rgba(255,255,255,0.15);}
#fc-pill.pressing{background:rgba(0,0,0,0.5);border:1.5px solid rgba(77,184,255,0.6);}#fc-pill.pressing #fc-mag,#fc-pill.open #fc-mag{background:rgba(255,255,255,0.08);}
#fc-mag{width:32px;height:32px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;transition:background 0.2s;}
#fc-ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;pointer-events:none;}
#fc-ring.active{border-color:rgba(77,184,255,0.6);animation:fcring 1.5s linear forwards;}
@keyframes fcring{0%{transform:scale(0.6);opacity:0;}50%{transform:scale(1);opacity:1;border-color:rgba(77,184,255,0.8);}100%{transform:scale(1.15);opacity:0;}}
#fc-controls{display:flex;align-items:center;gap:6px;margin-left:8px;opacity:0;transition:opacity 0.2s;white-space:nowrap;flex-shrink:0;}
#fc-pill.open #fc-controls{opacity:1;}
</style>
<div id="fc-pill">
  <div id="fc-mag"><div id="fc-ring"></div><svg width="18" height="18" viewBox="0 0 20 20" fill="none" style="display:block;flex-shrink:0;"><circle cx="8.5" cy="8.5" r="5" stroke="rgba(255,255,255,0.75)" stroke-width="1.8"/><line x1="12.5" y1="12.5" x2="17" y2="17" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linecap="round"/></svg></div>
  <div id="fc-controls">
    <span style="font-size:10px;color:rgba(255,255,255,0.4);font-family:sans-serif;font-weight:400;">A</span>
    <input type="range" id="font-size-slider" min="16" max="22" value="16" step="1" style="width:72px;cursor:pointer;accent-color:#4db8ff;" oninput="applyFontSize(this.value)">
    <span style="font-size:14px;color:rgba(255,255,255,0.5);font-family:sans-serif;font-weight:400;">A</span>
  </div>
</div>

<!-- Zoom root — wraps class-select + game-screen so applyFontSize() can scale
     the content via CSS transform. Without this wrapper the zoom slider
     silently no-ops on the player screen. -->
<div id="zoom-root" style="width:100%;height:100dvh;transform-origin:top left;">

<!-- CLASS SELECTOR -->
<div id="class-select-screen">
  <h1>⚔️ Brick Quest</h1>
  <p>Select your character</p>
  <div style="margin-bottom:16px;width:100%;max-width:400px;">
    <input id="player-name-input" type="text" maxlength="24" placeholder="Your first name (e.g. Alex)"
      style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#eee;font-size:15px;font-family:Crimson Pro,serif;outline:none;">
  </div>
  <div class="cls-grid" id="cls-grid"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- TRADE CONSENT MODAL -->
<div class="modal-overlay" id="trade-modal">
  <div class="modal-box">
    <div style="font-size:28px;margin-bottom:6px;">🔄</div>
    <div class="modal-title">Trade Request!</div>
    <div class="modal-body" id="trade-modal-body">—</div>
    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="btn success" onclick="respondTrade(true)" style="flex:1;font-size:16px;padding:14px;font-family:Cinzel,serif;">✓ Accept</button>
      <button class="btn danger"  onclick="respondTrade(false)" style="flex:1;font-size:16px;padding:14px;font-family:Cinzel,serif;">✗ Decline</button>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div class="topbar">
    <span class="topbar-icon" id="t-icon">⚔️</span>
    <span class="topbar-name" id="t-name">—</span>
    <!-- v0.16.8: connect indicator moved inline with topbar-name as a small dot -->
    <span class="conn-dot off" id="conn-dot" title="Connection status"></span>

  </div>
  <div class="phase-banner waiting" id="phase-banner">Connecting…</div>
  <!-- v0.16.8: tabs/tab-content replaced with single dashboard host. Pane-party
       and pane-fusion removed entirely; their content now surfaces in the
       dynamic zone via hold-gestures (v0.16.9+). -->
  <div class="dashboard-host" id="dashboard-host">
    <div id="pane-dashboard" class="dash-surface active"></div>
  </div>
</div>
</div><!-- end #zoom-root -->

<!-- ── RUMBLE (real-time combat runtime) ──
     Hidden by default; shown when server reports active rumbleBattle.
     DOM structure matches rumble.js requirements (see rumble.js:40).
     HUD with timer is optional but helpful for pacing. -->
<div id="rumble-root">
  <div id="rumble-hud">
    <div id="rumble-hud-right">
      <div id="rumble-timer-display">INF</div>
      <div id="rumble-timer-label">SECS</div>
    </div>
  </div>
  <canvas id="rumble-canvas"></canvas>
  <div id="rumble-brick-bar-left" class="rumble-brick-bar"></div>
  <div id="rumble-brick-bar-right" class="rumble-brick-bar"></div>
  <div id="rumble-exit-overlay"></div>
</div>

<script src="characters.js"></script>
<script src="game.js"></script>
<script src="rumble.js"></script>
<script src="boardFx.js"></script>
<script src="players-core.js"></script>
<script>
(function buildSelector(){
  const grid = document.getElementById('cls-grid');
  Object.entries(PLAYER_META).forEach(([cls,m])=>{
    const s = getCharUiStyle(cls);
    const btn = document.createElement('button');
    btn.className = 'cls-btn';
    btn.style.borderColor = s.border;
    btn.innerHTML = `<span class="icon">${m.icon}</span><span class="cname">${m.name}</span>`;
    btn.onclick = () => selectClass(cls);
    grid.appendChild(btn);
  });
})();

function connectWS() {
  client = new GameClient(MY_CLASS);
  client._afterConnect = true;
  client.on((event, data) => {
    if (event === 'connected') { setConn(true); }
    if (event === 'disconnected') { setConn(false); }
    if (event === 'state') {
      G = data;
      // Clear pending trade if server has no active trade (accepted, declined, or expired)
      if (_pendingTradeSent && !G.pendingTrade) _pendingTradeSent = null;
      // Rumble runtime hook: sync the local Rumble instance to the server's
      // rumbleBattle state. See rumble-manager block below for transition logic.
      syncRumbleFromState(G);
      render();
    }
    if (event === 'tradeOffer') { showTradeModal(data.offer); }
    if (event === 'tradeAccepted') {
      var isInitiator = data.fromCls === MY_CLASS;
      _pendingTradeSent = null;
      render();
      if (isInitiator) toast('✓ Trade accepted! You received 1 ' + data.wantColor, 'success');
    }
    if (event === 'tradeDeclined') {
      _pendingTradeSent = null;
      render();
      var declinerName = G&&G.players[data.toCls]?(G.players[data.toCls].playerName||G.players[data.toCls].name):data.toCls;
      toast(declinerName + ' declined the trade', 'warn');
    }
    if (event === 'snapstepDisarmChain') { handleDisarmChain(data); }
    if (event === 'error') {
      // S015 DIAGNOSTIC: tracing full-HP toast investigation
      console.log('[DIAG error received]', data);
      toast(data.msg, 'warn');
    }
    if (event === 'forceGateResult') {
      var gateMsg = data.success
        ? 'Gate forced open! — took 2 damage'
        : 'Gate held firm — took 2 damage';
      showGateResult(gateMsg, data.success);
    }
    if (event === 'dashDenied') {
      if (data.cls === MY_CLASS) {
        toast('Dash not possible — ' + (data.reason || 'denied'), 'warn');
      }
    }
    if (event === 'dashResult') {
      if (data.cls === MY_CLASS) {
        showDashResult(data);
      }
    }
    if (event === 'rewardPopup') {
      var isRiddleYellow = data.kind === 'brick' && data.color === 'yellow' && G && G.activeEvent && G.activeEvent.evType === 'riddle';
      // Reward FX routing — all ambient via boardFx (v0.15.36 finished
      // the migration). Anchor is the event card (#landing-result); if
      // absent, boardFx silently skips (which is fine for ambient FX).
      if (data.kind === 'shield') {
        BoardFx.fire('shieldCrit', '#my-shield-section', data);
      } else if (data.kind === 'brick' && !isRiddleYellow) {
        BoardFx.fire('brickGained', '#landing-result', data);
      } else if (data.kind === 'gold') {
        BoardFx.fire('goldGained', '#landing-result', data);
      } else if (!isRiddleYellow) {
        // Fallback for unknown kinds — keep the legacy must-click card.
        showRewardPopup(data);
      }
    }
    if (event === 'clueDiscovered') {
      // New clue revealed — render so the Dashboard clues section picks it up.
      // If the player is on the Dashboard tab, scroll to the clues block.
      render();
      var pane = document.getElementById('pane-dashboard');
      if (pane && pane.classList.contains('active')) {
        setTimeout(function() {
          var clueEl = document.getElementById('status-clues');
          if (clueEl) clueEl.scrollIntoView({behavior:'smooth', block:'start'});
        }, 300);
      }
    }

  });
}

function setConn(on) {
  // v0.16.8: conn-pill replaced with conn-dot. Smaller, inline with name.
  const el = document.getElementById('conn-dot');
  if (el) el.className = 'conn-dot '+(on?'on':'off');
  if (on && MY_CLASS) {
    const name = (document.getElementById('player-name-input')?.value||'').trim();
    if (name) client.send('setPlayerName', {cls:MY_CLASS, name});
  }
}
</script>

</body>
</html>
