<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Brick Quest — Test Players</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rumble.css">
<link rel="stylesheet" href="boardFx.css">
<style>

/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cls-color:#888;--cls-bg:#111;--cls-border:#333;
  --surface:#0f0f0f;--surface2:#1a1a1a;--surface3:#242424;
  --text:#e8e8e8;--text-dim:#888;--text-faint:#444;
  --green:#1D9E75;--red:#E24B4A;--yellow:#F5D000;--orange:#F57C00;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--surface);color:var(--text);font-size:15px;}

/* ── CLASS SELECTOR ── */
#class-select-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;padding:20px;
  background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0a 100%);
}
#class-select-screen h1{
  font-family:'Cinzel',serif;font-size:28px;color:#F5D000;
  letter-spacing:.1em;margin-bottom:6px;text-align:center;
}
#class-select-screen p{font-size:14px;color:#666;margin-bottom:24px;text-align:center;}
.cls-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:400px;}
.cls-btn{
  padding:16px 8px;border-radius:12px;border:1px solid #333;
  background:#1a1a1a;cursor:pointer;text-align:center;
  transition:all .2s;
}
.cls-btn:active{transform:scale(.95);}
.cls-btn .icon{font-size:28px;display:block;margin-bottom:4px;}
.cls-btn .cname{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;color:#aaa;}
.cls-btn:hover{border-color:#666;}

/* ── MAIN LAYOUT ── */
#game-screen{display:none;height:100vh;height:100dvh;flex-direction:column;}
#game-screen.visible{display:flex;}

/* ── ARENA (rumble combat runtime) ── */
#rumble-root{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#0a0a0a;
  z-index:100;
  overflow:hidden;
}
#rumble-root.visible{display:block;}
#rumble-root #rumble-canvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  touch-action:none;
  z-index:1;  /* override rumble.css's z-index:50 — bricks must layer above */
}
#rumble-root #rumble-hud{
  position:absolute;top:8px;right:10px;
  color:#e8e8e8;font-family:'Cinzel',serif;
  font-size:14px;letter-spacing:.08em;
  pointer-events:none;z-index:10;
}
#rumble-root #rumble-timer-display{font-size:22px;font-weight:700;}
#rumble-root #rumble-timer-label{font-size:9px;color:#888;letter-spacing:.12em;}
#rumble-root .rumble-brick-bar{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:6px;
  max-height:95vh;
  overflow-y:auto;
  z-index:60;  /* must beat canvas z-index */
}
#rumble-root #rumble-brick-bar-left{left:0;}
#rumble-root #rumble-brick-bar-right{right:0;}
#rumble-exit-overlay{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);padding:24px 36px;
  border:2px solid var(--yellow);border-radius:8px;
  font-family:'Cinzel',serif;font-size:20px;letter-spacing:.08em;
  text-align:center;color:#fff;z-index:20;display:none;
}
#rumble-exit-overlay.visible{display:block;}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:4px 12px;
  background:linear-gradient(90deg,var(--cls-bg),#0a0a0a);
  border-bottom:1px solid var(--cls-border);
  flex-shrink:0;
  transition:max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease, border-bottom-width 0.2s ease;
  max-height:36px;
  overflow:hidden;
}
.topbar.hidden-on-scroll{
  max-height:0;
  padding-top:0;
  padding-bottom:0;
  opacity:0;
  border-bottom-width:0;
}
.topbar-icon{font-size:18px;}
.topbar-name{font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:var(--cls-color);}
/* v0.16.8: connect indicator is a small dot, replacing the standalone conn-pill. */
.conn-dot{width:8px;height:8px;border-radius:50%;margin-left:6px;display:inline-block;vertical-align:middle;transition:background .2s, box-shadow .2s;}
.conn-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
.conn-dot.off{background:#444;box-shadow:none;}

/* PHASE BANNER */
.phase-banner{
  padding:4px 14px;text-align:center;font-size:11px;font-weight:600;
  font-family:'Cinzel',serif;letter-spacing:.05em;flex-shrink:0;
  transition:max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease, border-bottom-width 0.2s ease;
  max-height:32px;
  overflow:hidden;
}
.phase-banner.hidden-on-scroll{
  max-height:0;
  padding-top:0;
  padding-bottom:0;
  opacity:0;
  border-bottom-width:0;
}
.phase-banner.mine{background:var(--cls-bg);border-bottom:1px solid var(--cls-color);color:var(--cls-color);}
.phase-banner.waiting{background:#0a0a0a;border-bottom:1px solid #222;color:#444;}
.phase-banner.battle-mine{background:#1a0505;border-bottom:2px solid var(--red);color:var(--red);}
.phase-banner.battle-wait{background:#0f0505;border-bottom:1px solid #333;color:#555;}

/* TABS */
/* DASHBOARD HOST (v0.16.8 — replaces tabs system entirely) */
.dashboard-host{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,12px));background:var(--surface);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.dash-surface{display:none;min-height:100%;padding-bottom:calc(160px + env(safe-area-inset-bottom,0px));}
.dash-surface.active{display:block;}
/* DYNAMIC ZONE (v0.16.8) */
.dynamic-zone{position:relative;margin-bottom:10px;min-height:48px;transition:min-height .25s ease;}
.dynamic-zone:empty{display:none;}
/* INTERACTION ROW (v0.16.8) */
.interaction-row{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;padding:8px;background:var(--surface2);border:1px solid #2a2a2a;border-radius:10px;margin-bottom:10px;}
.interaction-row .brick-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;}
.interaction-row .resource-chips{display:flex;gap:6px;align-items:stretch;}
.res-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;padding:6px 10px;background:var(--surface3);border-radius:8px;border:1px solid transparent;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s, background .15s, transform .1s;touch-action:none;}
.res-chip:active{transform:scale(.95);}
.res-chip-glyph{font-size:18px;line-height:1;}
.res-chip-num{font-family:'Cinzel',serif;font-size:14px;font-weight:700;margin-top:2px;}
.res-chip[data-res="gold"] .res-chip-num{color:#F5D000;}
.res-chip[data-res="cheese"] .res-chip-num{color:#FFD96A;}
.res-chip[data-res="avatar"]{padding:6px 8px;}
.res-chip[data-res="avatar"] .res-chip-glyph{font-size:24px;}

/* CARDS */
.card{
  background:var(--surface2);border:1px solid #2a2a2a;
  border-radius:10px;padding:12px;margin-bottom:10px;
}
.card-title{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;
  color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;
}

/* HP BAR */
.hp-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.hp-big{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--cls-color);}
.hp-max{font-size:14px;color:var(--text-dim);}
.hpbar-outer{height:10px;border-radius:5px;background:#222;overflow:hidden;margin-bottom:8px;}
.hpbar-inner{height:100%;border-radius:5px;transition:width .4s,background .4s;}

/* STATS ROW */
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:stretch;}
.stat-chip{
  background:var(--surface3);border-radius:8px;padding:7px 12px;
  text-align:center;flex:1;min-width:55px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.stat-num{font-family:'Cinzel',serif;font-size:18px;font-weight:700;}
.stat-lbl{font-size:10px;color:var(--text-dim);margin-top:1px;}

/* BRICKS */
.bricks-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.brick-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px 4px 6px;border-radius:20px;
  font-size:12px;font-weight:600;cursor:pointer;
  transition:opacity .15s;border:1px solid transparent;
}
.brick-tag:active{opacity:.6;}
.brick-tag.zero{opacity:.3;cursor:default;}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;margin-bottom:7px;
  border-radius:10px;border:1px solid #333;background:var(--surface3);
  color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;transition:all .15s;
  line-height:1.3;
}
.btn:active{opacity:.7;transform:scale(.98);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn.primary{background:var(--cls-bg);border-color:var(--cls-color);color:var(--cls-color);}
.btn.danger{background:#1a0505;border-color:var(--red);color:var(--red);}
.btn.success{background:#051a0f;border-color:var(--green);color:var(--green);}
.btn.warn{background:#1a1005;border-color:var(--orange);color:var(--orange);}
.btn-row{display:flex;gap:6px;margin-bottom:7px;}
.btn-row .btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;margin-bottom:7px;
  border-radius:10px;border:1px solid #333;background:var(--surface3);
  color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;
  font-weight:600;cursor:pointer;text-align:center;transition:all .15s;
  line-height:1.3;
}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;display:inline-block;width:auto;}
.adj{
  padding:5px 12px;font-size:16px;border-radius:7px;
  border:1px solid #333;background:var(--surface3);
  cursor:pointer;color:var(--text);font-weight:700;
}
.adj:active{opacity:.6;}

/* ROLL DISPLAY */
.roll-display{
  background:var(--surface3);border-radius:12px;
  padding:16px;text-align:center;margin:8px 0;
}
.roll-num{font-family:'Cinzel',serif;font-size:52px;font-weight:700;color:var(--cls-color);}
.roll-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

/* CREEPER MINI-GAME */
.vine-container{
  position:relative;height:48px;border-radius:10px;
  background:#0a1a0a;border:1px solid #1a3a1a;overflow:hidden;margin:8px 0;
}
.vine-track{
  position:absolute;top:50%;left:0;right:0;height:6px;
  transform:translateY(-50%);background:#1a3a1a;border-radius:3px;
}
.vine-zone{
  position:absolute;top:50%;height:6px;transform:translateY(-50%);
  background:#237841;border-radius:3px;
}
.vine-indicator{
  position:absolute;top:50%;width:16px;height:24px;
  transform:translate(-50%,-50%);
  background:var(--yellow);border-radius:4px;transition:left .05s linear;
}
.cut-btn{
  width:100%;padding:14px;font-family:'Cinzel',serif;font-size:16px;
  font-weight:700;letter-spacing:.05em;border-radius:10px;
  background:#0a2a0a;border:2px solid #237841;color:#237841;cursor:pointer;
}
.cut-btn:active{background:#1D9E75;color:#fff;}

/* TRADE */
.trade-row{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:8px;background:var(--surface3);border:1px solid #2a2a2a;
  margin-bottom:6px;
}

/* PARTY */
.party-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:8px;
  background:var(--surface3);margin-bottom:6px;
}
.party-icon{font-size:20px;}
.party-hp-bar{flex:1;height:6px;border-radius:3px;background:#222;overflow:hidden;}
.party-hp-fill{height:100%;border-radius:3px;transition:width .3s;}

/* SKILL ROWS */
.skill-card{
  padding:10px 12px;border-radius:10px;border:1px solid #2a2a2a;
  background:var(--surface3);margin-bottom:7px;
}
.skill-card.locked .skill-name,.skill-card.locked .skill-desc{filter:blur(4px);user-select:none;pointer-events:none;}
.skill-card.partial{border-color:var(--cls-color);border-style:dashed;}
.skill-card.owned{border-color:var(--cls-color);}
.skill-name{font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--cls-color);margin-bottom:3px;}
.skill-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:5px;}
.skill-use{font-size:11px;color:var(--green);margin-top:3px;}
.skill-prog{height:3px;border-radius:2px;background:#222;overflow:hidden;margin-bottom:5px;}
.skill-prog-fill{height:100%;border-radius:2px;}
.cost-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.cost-tag{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px 2px 5px;border-radius:10px;font-size:11px;font-weight:600;
}

/* TRADE CONSENT MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;background:#000a;
  z-index:100;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.visible{display:flex;}
.modal-box{
  background:#1a1a1a;border:1px solid var(--cls-color);
  border-radius:14px;padding:20px;max-width:320px;width:100%;text-align:center;
}
.modal-title{font-family:'Cinzel',serif;font-size:16px;color:var(--cls-color);margin-bottom:8px;}
.modal-body{font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}

/* STATUS BADGES */
.status-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.status-badge{
  font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;
}
.status-badge.poisoned{background:#1a0a00;color:var(--orange);}
.status-badge.cursed{background:#1a0a1a;color:#7B2FBE;}
.status-badge.confused{background:#1a1500;color:var(--yellow);}
.status-badge.down{background:#1a0505;color:var(--red);}

/* DIVIDER */
.dv{border:none;border-top:1px solid #222;margin:10px 0;}

/* NOTIFICATION TOAST */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;
  background:#1a1a1a;border:1px solid #444;color:var(--text);
  z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}

#class-select-screen{display:none!important;}
#game-screen{display:flex!important;height:calc(100vh - 54px);}
#test-bar{display:flex;align-items:center;background:#060610;border-bottom:2px solid #222;flex-shrink:0;overflow-x:auto;}
.cls-sw{flex:1;min-width:52px;padding:10px 4px 8px;text-align:center;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;position:relative;}
.cls-sw .sw-icon{font-size:20px;display:block;}
.cls-sw .sw-label{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.03em;color:#555;display:block;margin-top:2px;}
.cls-sw .sw-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#333;}
.cls-sw.active .sw-label{color:var(--cls-color);}
.cls-sw.active{border-bottom-color:var(--cls-color);}
.cls-sw .sw-dot.on{background:#1D9E75;box-shadow:0 0 4px #1D9E75;}
.test-lbl{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.06em;color:#333;padding:0 8px;border-right:1px solid #1a1a1a;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;height:54px;}

</style>
</head>
<body>
<div id="test-bar">
  <div class="test-lbl">TEST</div>
  <button class="cls-sw active" id="sw-breaker" onclick="testSwitch('breaker')"><span class="sw-icon">⚔️</span><span class="sw-label">Breaker</span><span class="sw-dot" id="dot-breaker"></span></button>
  <button class="cls-sw" id="sw-formwright" onclick="testSwitch('formwright')"><span class="sw-icon">🔮</span><span class="sw-label">Formwright</span><span class="sw-dot" id="dot-formwright"></span></button>
  <button class="cls-sw" id="sw-snapstep" onclick="testSwitch('snapstep')"><span class="sw-icon">🏃</span><span class="sw-label">Snapstep</span><span class="sw-dot" id="dot-snapstep"></span></button>
  <button class="cls-sw" id="sw-blocksmith" onclick="testSwitch('blocksmith')"><span class="sw-icon">🔧</span><span class="sw-label">Blocksmith</span><span class="sw-dot" id="dot-blocksmith"></span></button>
  <button class="cls-sw" id="sw-fixer" onclick="testSwitch('fixer')"><span class="sw-icon">💊</span><span class="sw-label">Fixer</span><span class="sw-dot" id="dot-fixer"></span></button>
  <button class="cls-sw" id="sw-wild_one" onclick="testSwitch('wild_one')"><span class="sw-icon">🐾</span><span class="sw-label">Wild One</span><span class="sw-dot" id="dot-wild_one"></span></button>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="trade-modal"><div class="modal-box"><div style="font-size:28px;margin-bottom:6px;">🔄</div><div class="modal-title">Trade Request!</div><div class="modal-body" id="trade-modal-body">—</div><div style="display:flex;gap:10px;margin-top:4px;"><button class="btn success" onclick="respondTrade(true)" style="flex:1;font-size:16px;padding:14px;font-family:Cinzel,serif;">✓ Accept</button><button class="btn danger" onclick="respondTrade(false)" style="flex:1;font-size:16px;padding:14px;font-family:Cinzel,serif;">✗ Decline</button></div></div></div>
<style>
#fc-pill{position:fixed;bottom:14px;right:14px;z-index:9999;display:flex;align-items:center;background:transparent;border:none;border-radius:22px;height:44px;padding:0 6px;overflow:hidden;width:44px;transition:width 0.3s ease,background 0.3s,border 0.25s;}
#fc-pill.open{width:200px;background:rgba(0,0,0,0.72);border:1.5px solid rgba(255,255,255,0.15);}
#fc-pill.pressing{background:rgba(0,0,0,0.5);border:1.5px solid rgba(77,184,255,0.6);}#fc-pill.pressing #fc-mag,#fc-pill.open #fc-mag{background:rgba(255,255,255,0.08);}
#fc-mag{width:32px;height:32px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;transition:background 0.2s;}
#fc-ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;pointer-events:none;}
#fc-ring.active{border-color:rgba(77,184,255,0.6);animation:fcring 1.5s linear forwards;}
@keyframes fcring{0%{transform:scale(0.6);opacity:0;}50%{transform:scale(1);opacity:1;border-color:rgba(77,184,255,0.8);}100%{transform:scale(1.15);opacity:0;}}
#fc-controls{display:flex;align-items:center;gap:6px;margin-left:8px;opacity:0;transition:opacity 0.2s;white-space:nowrap;flex-shrink:0;}
#fc-pill.open #fc-controls{opacity:1;}

/* S013 §1.2 — empty pip pulse, 3 recency tiers */
@keyframes pip-pulse {
  0%,100% { opacity: 0.55; }
  50%     { opacity: 0.95; }
}
.pip-empty            { animation: pip-pulse 1.8s ease-in-out infinite; }
.pip-empty.pulse-fast { animation-duration: 0.6s; }
.pip-empty.pulse-med  { animation-duration: 1.0s; }
.pip-empty.pulse-slow { animation-duration: 1.8s; }

</style>
<div id="fc-pill">
  <div id="fc-mag"><div id="fc-ring"></div><svg width="18" height="18" viewBox="0 0 20 20" fill="none" style="display:block;flex-shrink:0;"><circle cx="8.5" cy="8.5" r="5" stroke="rgba(255,255,255,0.75)" stroke-width="1.8"/><line x1="12.5" y1="12.5" x2="17" y2="17" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linecap="round"/></svg></div>
  <div id="fc-controls">
    <span style="font-size:10px;color:rgba(255,255,255,0.4);font-family:sans-serif;font-weight:400;">A</span>
    <input type="range" id="font-size-slider" min="16" max="22" value="16" step="1" style="width:72px;cursor:pointer;accent-color:#4db8ff;" oninput="applyFontSize(this.value)">
    <span style="font-size:14px;color:rgba(255,255,255,0.5);font-family:sans-serif;font-weight:400;">A</span>
  </div>
</div>
<div id="zoom-root" style="width:100%;height:100dvh;transform-origin:top left;">
<div id="class-select-screen"></div>
<div id="game-screen">
  <div class="topbar"><span class="topbar-icon" id="t-icon">⚔️</span><span class="topbar-name" id="t-name">Breaker</span><span style="font-size:10px;color:#F5D000;background:#1a1500;padding:2px 8px;border-radius:8px;font-family:Cinzel,serif;">TEST</span><span class="conn-dot off" id="conn-dot" title="Connection status"></span></div>
  <div class="phase-banner waiting" id="phase-banner">Waiting…</div>
  <!-- v0.16.8: tabs/tab-content replaced with single dashboard host. Pane-party
       and pane-fusion removed entirely; their content now surfaces in the
       dynamic zone via hold-gestures (v0.16.9+). -->
  <div class="dashboard-host" id="dashboard-host">
    <div id="pane-dashboard" class="dash-surface active"></div>
  </div>
</div>
</div>

<!-- ── ARENA (rumble combat runtime) ── -->
<div id="rumble-root">
  <div id="rumble-hud">
    <div id="rumble-hud-right">
      <div id="rumble-timer-display">INF</div>
      <div id="rumble-timer-label">SECS</div>
    </div>
  </div>
  <canvas id="rumble-canvas"></canvas>
  <div id="rumble-brick-bar-left" class="rumble-brick-bar"></div>
  <div id="rumble-brick-bar-right" class="rumble-brick-bar"></div>
  <div id="rumble-exit-overlay"></div>
</div>

<script src="characters.js"></script>
<script src="game.js"></script>
<script src="rumble.js"></script>
<script src="boardFx.js"></script>
<script src="players-core.js"></script>

<script>

var MY_CLASS = 'breaker';
var G = null;
var client = null;
var pendingTradeOffer = null;
var lastRoll = null;

// (Second CLS_STYLES declaration was dead-duplicate of the first — deleted
// in Phase 2 consolidation. Both usage sites now use getCharUiStyle from
// characters.js.)

var _testClients = {};
var _testConnected = {};

var TAB_DEFS = [
  { id:'dashboard', label:'Dashboard' },
  { id:'party',     label:'Party'     },
  { id:'fusion',    label:'Fusion'    },
];

function testSwitch(cls) {
  MY_CLASS = cls;
  _pendingResult = null;
  var s = getCharUiStyle(cls);
  var m = PLAYER_META[cls];
  document.documentElement.style.setProperty('--cls-color', s.color);
  document.documentElement.style.setProperty('--cls-bg',    s.bg);
  document.documentElement.style.setProperty('--cls-border',s.border);
  document.getElementById('t-icon').textContent = m.icon;
  document.getElementById('t-name').textContent = m.name + ' [TEST]';
  document.querySelectorAll('.cls-sw').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('sw-'+cls);
  if (btn) btn.classList.add('active');
  client = _testClients[cls] || null;
  // v0.16.8: conn-pill replaced with conn-dot.
  var dot = document.getElementById('conn-dot');
  var on = !!_testConnected[cls];
  if (dot) dot.className = 'conn-dot ' + (on?'on':'off');
  buildTabs();
  if (G) render();
}

function connectWS() {
  Object.keys(PLAYER_META).forEach(function(cls) {
    var c = new GameClient(cls);
    _testClients[cls] = c;
    c.on(function(event, data) {
      if (event === 'connected') {
        _testConnected[cls] = true;
        var dot = document.getElementById('dot-'+cls);
        if (dot) dot.className = 'sw-dot on';
        if (cls === MY_CLASS) {
          client = c;
          // v0.16.8: conn-pill -> conn-dot
          var p = document.getElementById('conn-dot');
          if (p) p.className = 'conn-dot on';
        }
        c.send('setPlayerName', {cls:cls, name:'[TEST] '+PLAYER_META[cls].name});
      }
      if (event === 'disconnected') {
        _testConnected[cls] = false;
        var dot = document.getElementById('dot-'+cls);
        if (dot) dot.className = 'sw-dot';
        if (cls === MY_CLASS) {
          var p = document.getElementById('conn-dot');
          if (p) p.className = 'conn-dot off';
        }
      }
      if (event === 'state') {
        G = data;
        if (_pendingTradeSent && !G.pendingTrade) _pendingTradeSent = null;
        if (cls === MY_CLASS) {
          // Rumble runtime hook — same as players.html. Without this, the
          // arena-root never transitions when a battle starts.
          try { syncRumbleFromState(G); } catch(e) { console.error('[rumble-manager] syncRumbleFromState threw:', e); }
          try { render(); } catch(e) { console.error('render:', e.message); }
        }
      }
      if (cls !== MY_CLASS) {
        // tradeOffer — always show modal in test since we simulate all players
        if (event === 'tradeOffer' && data.offer) showTradeModal(data.offer);
        return;
      }
      if (event === 'tradeOffer')      showTradeModal(data.offer);
      if (event === 'error') {
        // S015 DIAGNOSTIC: tracing full-HP toast investigation (test harness)
        console.log('[DIAG error received - test]', data);
        toast(data.msg, 'warn');
      }
      if (event === 'rewardPopup') { var isRiddleYellow = data.kind==='brick' && data.color==='yellow' && G && G.activeEvent && G.activeEvent.evType==='riddle'; if (data.kind === 'shield') { BoardFx.fire('shieldCrit', '#my-shield-section', data); } else if (data.kind === 'brick' && !isRiddleYellow) { BoardFx.fire('brickGained', '#landing-result', data); } else if (data.kind === 'gold') { BoardFx.fire('goldGained', '#landing-result', data); } else if (!isRiddleYellow) { showRewardPopup(data); } }
      if (event === 'forceGateResult') showGateResult(data.success?'Gate forced!':'Gate held — 2 dmg', data.success);
      if (event === 'dashDenied' && data.cls===MY_CLASS) toast('Dash not possible — '+(data.reason||'denied'),'warn');
      if (event === 'dashResult' && data.cls===MY_CLASS) showDashResult(data);
    });
  });
}

function setConn() {}  // no-op

window.addEventListener('load', function() {
  testSwitch('breaker');
  buildTabs();
  connectWS();
});

</script>
</body>
</html>
